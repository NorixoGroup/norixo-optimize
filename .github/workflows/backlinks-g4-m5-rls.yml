name: Backlinks G4-M5 RLS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/backlinks-g4-m5-rls-test-harness/**"
      - "scripts/backlinks-g4-m5-rls-rollback.sql"
      - "supabase/migrations/20261104120000_enable_rls_backlink_outreach_initial_attempt_snapshots.sql"
      - "supabase/migrations/20261104130000_restrict_backlink_outreach_select_to_workspace_admins.sql"
      - ".github/workflows/backlinks-g4-m5-rls.yml"

permissions:
  contents: read

jobs:
  rls-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install PostgreSQL 16 (Ubuntu 24.04 archive)
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-16 postgresql-client-16
          # Stop the packaged cluster; a private throwaway cluster is used instead.
          sudo systemctl stop postgresql || true

      - name: Start throwaway PostgreSQL cluster (unix socket only, no TCP)
        shell: bash
        run: |
          set -euo pipefail
          PG_BIN=/usr/lib/postgresql/16/bin
          PGDATA="$RUNNER_TEMP/pgdata"
          PGSOCK="$RUNNER_TEMP/pgsock"
          mkdir -p "$PGSOCK"
          "$PG_BIN/initdb" -D "$PGDATA" -U postgres --auth=trust >/dev/null
          "$PG_BIN/pg_ctl" -D "$PGDATA" -w -l "$RUNNER_TEMP/pg.log" \
            -o "-c listen_addresses='' -c unix_socket_directories='$PGSOCK' -c fsync=off" start
          "$PG_BIN/createdb" -h "$PGSOCK" -U postgres norixo_g4_m5_rls_test
          {
            echo "PG_BIN=$PG_BIN"
            echo "NORIXO_RLS_PGHOST=$PGSOCK"
            echo "NORIXO_RLS_PGUSER=postgres"
          } >> "$GITHUB_ENV"

      - name: Run G4-M5 RLS harness (real migrations, scenarios, rollback)
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/backlinks-g4-m5-rls-test-harness/run_all.sh
          bash scripts/backlinks-g4-m5-rls-test-harness/run_all.sh

      - name: Show PostgreSQL log on failure
        if: failure()
        shell: bash
        run: tail -n 100 "$RUNNER_TEMP/pg.log" || true
